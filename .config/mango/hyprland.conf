# See https://wiki.hyprland.org/Configuring/Monitors/
# main monitor
monitor=eDP-1,preferred,0x0,1
# monitor=eDP-1,1920x1080,0x0,1
# monitor=eDP-1,disable
# HDMI port
# monitor=HDMI-A-1,highrr,auto-up,1
monitor=HDMI-A-1,preferred,auto-up,1
# monitor=HDMI-A-1,1600x1200,auto,auto,mirror,eDP-1 # duplicate
# monitor=HDMI-A-1,1920x1080,auto,auto,mirror,eDP-1 # duplicate
#monitor=HDMI-A-1,1600x1200,auto,auto

workspace = 2,monitor:HDMI-A-1
workspace = 3,monitor:HDMI-A-1

# STARTUP
exec-once = hypridle & waybar & dunst & nm-applet &
exec-once = ~/.scripts/battery-alert &
exec-once = awww-daemon; awww img $(cat ~/.current-wall)

$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$browser = firefox-developer-edition

# Some default env vars.
env = XDG_CURRENT_DESKTOP,Hyprland
env = BROWSER,$browser
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = WLR_NO_HARDWARE_CURSORS,1
env = MOZ_ENABLE_WAYLAND,1

env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, fcitx
env = INPUT_METHOD, fcitx


windowrule = match:class ^code, workspace 2 
windowrule = match:class ^firefox.*, workspace 3
windowrule = match:class ^(obsidian)$, workspace 4 silent 
windowrule = match:title ^OBS, workspace 7 silent
windowrule = match:title .*(Discord).*, workspace 8 silent
windowrule = match:class ^(spotify).*, workspace 9 silent
windowrule = match:class ^(steam)$, workspace 10 silent
windowrule = match:class ^(Waydroid)$, workspace 10 silent

windowrule = match:class ^Min$, opacity 1 override
windowrule = match:class scrcpy, opacity 1 override

# windowrulev2 = float, class:(thunar)
# windowrulev2 = size 900 600, class:Thunar

windowrule = match:title ^(Minecraft), workspace 10 silent
windowrule = match:title ^(Minecraft), pseudo 1

windowrule = match:class ^(firefox|ueberzug|Insomnia|chrome)(.*), match:focus 1, opacity 1 override

windowrule = size 800 600, match:title ^(Save|File Upload).*

gesture = 3, horizontal, workspace

# Source a file (multi-file configs)
source = ~/.config/hypr/keybinds.conf

input {
    kb_layout = us
    # kb_options = grp:win_space_toggle
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7cc)
    col.inactive_border = rgba(00000033)

    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

group {
    # https://wiki.hyprland.org/Configuring/Variables/#group
    col.border_active = rgba(7dcfffff)
    col.border_inactive = rgba(00000033)
    col.border_locked_active = rgba(7aa2f7cc)
    col.border_locked_inactive = rgba(00000033)

    groupbar {
        font_size = 0
        height = 0
        render_titles = true

        col.active = rgba(7dcfffff)
        col.inactive = rgba(00000033)
        col.locked_active = rgba(7aa2f7ff)
        col.locked_inactive = rgba(00000033)
    }
}

decoration {
    rounding = 6
    active_opacity = 0.85
    inactive_opacity = 0.85

    blur {
	      enabled = true
	      new_optimizations = true
	      size = 4
	      passes = 1
    }

    # drop_shadow = false
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

animations {
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    enabled = yes
    bezier = bzr, 0.1, 1, 0.0, 1
    animation = windows, 1, 3, bzr, slidevert
    animation = windowsOut, 1, 3, default, popin 10%
    animation = border, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = specialWorkspace, 1, 3, default, slidevert
}

# dwindle {
#     # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
#     pseudotile = yes
#     preserve_split = yes
# }

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
}

# gestures {
#     # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe_touch = true
# }

misc {
    font_family = JetBrains Mono
    force_default_wallpaper = 0 
    focus_on_activate = true
}

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
