# More option see https://github.com/DreamMaoMao/mango/wiki/

# Monitor
# NOTE: mango has NO native mirror/duplicate 
# mirror via wl-mirror (AUR: wl-mirror-git): run "wl-mirror -s" from the secondary output
monitorrule=name:^eDP-1$,x:0,y:1080,scale:1
monitorrule=name:^HDMI-A-1$,refresh:100.000,x:0,y:0,scale:1

# Env variables
env=MOZ_ENABLE_WAYLAND,1
env=BROWSER,firefox-developer-edition
env=QT_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=SDL_IM_MODULE,fcitx
env=GLFW_IM_MODULE,fcitx
env=INPUT_METHOD,fcitx

exec-once=waybar
exec-once=dunst
exec-once=~/.scripts/battery-alert
exec-once=awww-daemon; awww img $(cat ~/.current-wall)

# Window effect
blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes=1
blur_params_radius=4
# blur_params_noise=0.02
# blur_params_brightness=0.9
# blur_params_contrast=0.9
# blur_params_saturation=1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 4
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=0.85
unfocused_opacity=0.85

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.1,1.0,0.0,1
animation_curve_move=0.1,1.0,0.0,1
animation_curve_tag=0.1,1.0,0.0,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Layouts
circle_layout=tile,scroller 

# Scroller Layout Setting
scroller_structs=10
scroller_default_proportion=0.95
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=0
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=1,0.9,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
tag_num=10
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# Misc
xwayland_ignore_scale=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=0

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_accel_speed=0.2
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=1

# Appearance
gappih=3
gappiv=3
gappoh=8
gappov=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x201b14ff
bordercolor=0x00000033
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0x7aa2f7cc
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tagrule=id:10,layout_name:tile

# Key Bindings
source=./keybinds.conf

# Window Rule
source=./windowrule.conf

# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=noanim:1,noblur:1,layer_name:selection
# layerrule=animation_type_close:zoom,layer_name:rofi
