# Key Bindings - adapted from Hyprland (~/.config/hypr/keybinds.conf)
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload the config (hypr: $mainMod ALT, R, hyprctl reload)
bind=SUPER+ALT,R,reload_config

bind=SUPER,Return,spawn,kitty
bind=SUPER,q,killclient
bind=SUPER,e,spawn,thunar
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,b,spawn,firefox-developer-edition
bind=SUPER,p,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,l,spawn,loginctl lock-session
bind=SUPER,k,spawn,fcitx5-remote -t
bind=SUPER,n,switch_layout
# bind=SUPER,o,toggleoverview
bind=SUPER,Tab,toggleoverview

# switch window focus (hypr: movefocus)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# switch workspaces (hypr: workspace)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

# move active window to a workspace (hypr: movetoworkspace)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

# scratchpad (hypr: special workspace)
bind=SUPER,grave,toggle_scratchpad
# hypr: $mainMod SHIFT, GRAVE, movetoworkspace, special (no direct equivalent)

# scroll through workspaces (hypr: $mainMod + mouse wheel / $mainMod CTRL + arrows)
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0


# move/resize windows with mainMod + LMB/RMB and dragging
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# increase/decrease brightness (hypr: binde)
bind=SUPER,F5,spawn,brightnessctl s 5%-
bind=SUPER,F6,spawn,brightnessctl s 5%+

# volume (hypr: binde)
bind=SUPER,F1,spawn,~/.scripts/volume mute
bind=SUPER,F2,spawn,~/.scripts/volume down
bind=SUPER,F3,spawn,~/.scripts/volume up

# screenshot
bind=NONE,Print,spawn,~/.scripts/screenshot
bind=SUPER,Print,spawn,~/.scripts/screenshot window
bind=SUPER+SHIFT,Print,spawn,~/.scripts/screenshot region

# game mode
# bind=SUPER,F8,spawn,~/.scripts/gamemode

# wallpaper changer
bind=SUPER,F9,spawn,~/.scripts/wall-changer

# passmenu
bind=SUPER,F10,spawn,passmenu


# gesturebind=none,right,3,viewtoleft_have_client
# gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right
#
# Mouse Button Bindirightngs
# hypr: bindm = $mainMod, mouse:272/273 (mapped above)
# btn_left and btn_right can't bind none mod key
