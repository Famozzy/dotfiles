# format: window_rule=Parameter:Values,app_id:Values,title:Values
# note: mango uses app_id instead of hyprland's class

# tag assignment (hypr: workspace; tag 2 pinned to HDMI-A-1 like hypr's workspace=2 monitor:HDMI-A-1)
window_rule=tags:1,monitor:HDMI-A-1,app_id:^code
window_rule=tags:2,monitor:HDMI-A-1,app_id:^firefox
window_rule=tags:3,is_open_silent:1,title:Discord
window_rule=tags:3,is_open_silent:1,app_id:^spotify
window_rule=tags:3,is_open_silent:1,app_id:^(obsidian)$
window_rule=tags:4,is_open_silent:1,app_id:^(steam)$
window_rule=tags:4,is_open_silent:1,title:^OBS


# opacity override
window_rule=focused_opacity:1,unfocused_opacity:1,app_id:^Min$
window_rule=focused_opacity:1,unfocused_opacity:1,app_id:scrcpy
window_rule=focused_opacity:1,app_id:^(firefox|ueberzug|Insomnia|chrome)(.*)

# floating size for save dialogs
window_rule=width:800,height:600,is_floating:1,title:^(Save|File Upload)

# NOTE: mango has no "floating windows only" rule condition, so the old
# catch-all "noblur,floating:1" line was removed. Add no_blur:1 per app instead.
